name: Build YAWMY APK v1.0.8

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare complete offline content
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare_offline_assets.sh
          bash scripts/prepare_offline_assets.sh

      - name: Verify offline bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/raw/adhan.ogg
          test -s app/src/main/assets/adhan.ogg
          test -s app/src/main/assets/audio/notification.wav
          test -s app/src/main/assets/yawmiyati_logo.png
          test -s app/src/main/assets/yawmiyati_splash_icon.png
          test -s app/src/main/assets/data/hadith/bukhari.json
          test -s app/src/main/assets/data/hadith/muslim.json
          test -s app/src/main/assets/data/tafseer/muyassar.json
          test -s app/src/main/assets/data/names_of_allah/names_of_allah.json
          test -s app/src/main/assets/data/forties/nawawi40.json
          test -s app/src/main/assets/data/prophet_stories/index.json
          test "$(find app/src/main/assets/quran-pages -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 604
          test "$(find app/src/main/assets/data/quran/chapters/ar -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 114
          test "$(find app/src/main/assets/data/azkar -maxdepth 1 -type f -name '*.json' | wc -l)" -ge 12
          du -sh app/src/main/assets/quran-pages
          du -sh app/src/main/assets/data
          du -sh app/src/main/assets
          AS_BYTES="$(du -sb app/src/main/assets | cut -f1)"
          echo "Offline assets: ${AS_BYTES} bytes"
          test "$AS_BYTES" -ge 30000000

      - name: Static offline and Android checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'https?://|cdn\.jsdelivr|raw\.githubusercontent|quran-ws' app/src/main/assets/index.html
          grep -q "CONTENT_CDN='./data'" app/src/main/assets/index.html
          grep -q "MUSHAF_PAGE_IMAGE='./quran-pages/'" app/src/main/assets/index.html
          grep -q 'https://appassets.androidplatform.net/assets/index.html' app/src/main/java/com/yawmiyati/app/MainActivity.java
          grep -q 'WebViewAssetLoader' app/src/main/java/com/yawmiyati/app/MainActivity.java
          grep -q 'POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' app/src/main/AndroidManifest.xml
          grep -q 'ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK' app/src/main/java/com/yawmiyati/app/AdhanService.java
          grep -q 'import android.content.pm.ServiceInfo;' app/src/main/java/com/yawmiyati/app/AdhanService.java
          test ! -e app/src/main/assets/assets

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat -c 'APK size: %s bytes' app/build/outputs/apk/debug/app-debug.apk
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAWMY-debug-apk-v1.0.8
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
